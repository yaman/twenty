apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: twenty-backup-store
  namespace: twenty
spec:
  configuration:
    destinationPath: "s3://twenty-backups/"
    endpointURL: "http://minio.minio:9000"
    s3Credentials:
      accessKeyId:
        name: minio-creds
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-creds
        key: SECRET_ACCESS_KEY
