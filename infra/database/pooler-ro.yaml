apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: twenty-db-pooler-ro
  namespace: twenty
spec:
  cluster:
    name: twenty-db
  instances: 2
  type: ro
  pgbouncer:
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      min_pool_size: "5"
      reserve_pool_size: "5"
  monitoring:
    enablePodMonitor: true
