apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twenty-database
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/twenty.git
    targetRevision: main
    path: infra/database
  destination:
    server: https://kubernetes.default.svc
    namespace: twenty
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
