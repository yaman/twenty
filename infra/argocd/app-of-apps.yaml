apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: twenty-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/<org>/twenty.git  # REPLACE with your repo
    targetRevision: main
    path: infra/argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
