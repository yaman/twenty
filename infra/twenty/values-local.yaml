# Twenty Helm chart values for local development (Docker Desktop K8s)
# Uses external CloudNativePG + KeyDB + MinIO
#
# Install:
#   helm install twenty packages/twenty-docker/helm/twenty -n twenty -f infra/twenty/values-local.yaml --wait

fullnameOverride: twenty

image:
  repository: twentycrm/twenty
  tag: ""
  pullPolicy: IfNotPresent

# Disable internal DB — using CloudNativePG
db:
  enabled: false
  external:
    host: twenty-db-pooler-rw
    port: 5432
    user: twenty
    database: twenty
    secretName: twenty-db-app
    passwordKey: password

# Disable internal Redis — using KeyDB
redisInternal:
  enabled: false
redis:
  external:
    host: twenty-keydb
    port: 6379

# Disable PVC persistence — using S3 storage (MinIO)
server:
  enabled: true
  replicaCount: 2

  persistence:
    enabled: false
  dockerDataPersistence:
    enabled: false

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

  env:
    SIGN_IN_PREFILLED: "true"

  extraEnv:
    - name: PG_DATABASE_REPLICA_URL
      value: "postgres://twenty:$(DB_PASSWORD)@twenty-db-pooler-ro:5432/twenty"
    - name: METER_DRIVER
      value: prometheus
    - name: STORAGE_TYPE
      value: "S_3"
    - name: STORAGE_S3_ENDPOINT
      value: "http://minio.minio:9000"
    - name: STORAGE_S3_REGION
      value: "us-east-1"
    - name: STORAGE_S3_NAME
      value: "twenty-files"
    - name: STORAGE_S3_ACCESS_KEY_ID
      value: "minioadmin"
    - name: STORAGE_S3_SECRET_ACCESS_KEY
      value: "minioadmin123"

  ingress:
    enabled: false

worker:
  enabled: true
  replicaCount: 2

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

  extraEnv:
    - name: PG_DATABASE_REPLICA_URL
      value: "postgres://twenty:$(DB_PASSWORD)@twenty-db-pooler-ro:5432/twenty"
    - name: METER_DRIVER
      value: prometheus
    - name: STORAGE_TYPE
      value: "S_3"
    - name: STORAGE_S3_ENDPOINT
      value: "http://minio.minio:9000"
    - name: STORAGE_S3_REGION
      value: "us-east-1"
    - name: STORAGE_S3_NAME
      value: "twenty-files"
    - name: STORAGE_S3_ACCESS_KEY_ID
      value: "minioadmin"
    - name: STORAGE_S3_SECRET_ACCESS_KEY
      value: "minioadmin123"

# Override storage.type to prevent broken Helm helper (checks lowercase "s3")
storage:
  type: local
