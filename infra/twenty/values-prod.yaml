# Twenty Helm chart values for production (GKE)
# Uses external CloudNativePG + KeyDB + GCS

fullnameOverride: twenty

image:
  repository: twentycrm/twenty
  tag: ""
  pullPolicy: IfNotPresent

db:
  enabled: false
  external:
    host: twenty-db-pooler-rw
    port: 5432
    user: twenty
    database: twenty
    secretName: twenty-db-app
    passwordKey: password

redisInternal:
  enabled: false
redis:
  external:
    host: twenty-keydb
    port: 6379

server:
  enabled: true
  replicaCount: 2

  persistence:
    enabled: false
  dockerDataPersistence:
    enabled: false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

  env:
    SIGN_IN_PREFILLED: "false"

  extraEnv:
    - name: PG_DATABASE_REPLICA_URL
      value: "postgres://twenty:$(DB_PASSWORD)@twenty-db-pooler-ro:5432/twenty"
    - name: METER_DRIVER
      value: prometheus
    # Region and bucket come from ConfigMap (not supported by Helm storageEnv helper)
    - name: STORAGE_S3_REGION
      valueFrom:
        configMapKeyRef:
          name: twenty-config
          key: GCS_REGION
    - name: STORAGE_S3_NAME
      valueFrom:
        configMapKeyRef:
          name: twenty-config
          key: GCS_BUCKET

  ingress:
    enabled: true
    className: nginx
    acme: true
    hosts:
      - host: crm.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: twenty-tls
        hosts:
          - crm.example.com

worker:
  enabled: true
  replicaCount: 2

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  extraEnv:
    - name: PG_DATABASE_REPLICA_URL
      value: "postgres://twenty:$(DB_PASSWORD)@twenty-db-pooler-ro:5432/twenty"
    - name: METER_DRIVER
      value: prometheus
    - name: STORAGE_S3_REGION
      valueFrom:
        configMapKeyRef:
          name: twenty-config
          key: GCS_REGION
    - name: STORAGE_S3_NAME
      valueFrom:
        configMapKeyRef:
          name: twenty-config
          key: GCS_BUCKET

# storage.type=s3 sets STORAGE_TYPE=s3 env var; TwentyConfigService @CastToUpperSnakeCase maps it to S_3
# Endpoint and credentials handled by Helm storageEnv helper
# Region and bucket in extraEnv above (come from ConfigMap, not supported by helper)
# storage.type=s3 sets STORAGE_TYPE=s3 env var; TwentyConfigService @CastToUpperSnakeCase maps it to S_3
# Endpoint handled by Helm storageEnv helper
# Credentials from K8s secret via secretName/keys (overrides the placeholder values below)
# Region and bucket overridden by extraEnv ConfigMap refs above
storage:
  type: s3
  s3:
    endpoint: "https://storage.googleapis.com"
    bucket: ""
    region: ""
    secretName: twenty-gcs-hmac
    accessKeyIdKey: accessKeyId
    secretAccessKeyKey: secretAccessKey
    accessKeyId: "placeholder-overridden-by-secret"
    secretAccessKey: "placeholder-overridden-by-secret"
